name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências do backend
        run: dotnet restore backend/TalentValley.slnx

      - name: Compilar o backend
        run: dotnet build backend/TalentValley.slnx --no-restore

      - name: Executar testes do backend
        run: dotnet test backend/TalentValley.slnx --no-build

      - name: Restaurar ferramentas .NET
        run: dotnet tool restore

      - name: Verificar migrações pendentes
        run: dotnet ef migrations has-pending-model-changes --project backend/TalentValley.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Verificar pacotes vulneráveis
        run: dotnet list backend/TalentValley.slnx package --vulnerable --include-transitive | grep -q "has the following vulnerable packages" && exit 1 || exit 0

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend (npm ci)
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Executar lint do frontend
        run: npm run lint

      - name: Verificar tipos (typecheck)
        run: npm run typecheck

      - name: Compilar o frontend (build)
        run: npm run build

  docker:
    name: Backend (Docker build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Compilar imagem Docker
        run: docker build -t talent-valley-api backend/TalentValley.Api
