name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar .NET 10 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restaurar dependências do backend
        run: dotnet restore backend/TalentValley.slnx

      - name: Compilar o backend
        run: dotnet build backend/TalentValley.slnx --no-restore

      - name: Executar testes do backend
        run: dotnet test backend/TalentValley.slnx --no-build

      - name: Restaurar ferramentas .NET
        run: dotnet tool restore

      - name: Verificar migrações pendentes
        run: dotnet ef migrations has-pending-model-changes --project backend/TalentValley.Api
        env:
          ASPNETCORE_ENVIRONMENT: Development

      - name: Verificar pacotes vulneráveis
        run: dotnet list backend/TalentValley.slnx package --vulnerable --include-transitive | grep -q "has the following vulnerable packages" && exit 1 || exit 0

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências do frontend (npm ci)
        run: npm ci

      - name: Auditoria de dependências
        run: npm audit --omit=dev --audit-level=high

      - name: Executar lint do frontend
        run: npm run lint

      - name: Verificar tipos (typecheck)
        run: npm run typecheck

      - name: Executar testes do frontend
        run: npm test

      - name: Compilar o frontend (build)
        run: npm run build

  docker:
    name: Backend (Docker build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Compilar imagem Docker
        run: docker build -t talent-valley-api backend/TalentValley.Api

  skills-manifest:
    name: Manifesto de skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Validar SKILLS-MANIFEST.json
        run: |
          set -euo pipefail
          export LC_ALL=C
          manifest=./SKILLS-MANIFEST.json
          listed=$(node -p "require('$manifest').files.join('\n')" | sort)
          expected_count=$(node -p "require('$manifest').skill_count")
          tracked=$(git -c core.quotePath=false ls-files AGENTS.md .agents/skills | sort)
          skill_dirs=$(awk -F/ '$1 == ".agents" && NF >= 4 { print $3 }' <<< "$tracked" | sort -u | wc -l)
          status=0

          missing=$(comm -23 <(echo "$listed") <(echo "$tracked"))
          if [ -n "$missing" ]; then
            echo "::error::O manifesto cita caminhos que não são arquivos versionados de AGENTS.md ou .agents/skills (inexistentes ou repetidos):"
            echo "$missing"
            status=1
          fi

          unlisted=$(comm -13 <(echo "$listed") <(echo "$tracked"))
          if [ -n "$unlisted" ]; then
            echo "::error::Arquivos de skill que faltam no manifesto:"
            echo "$unlisted"
            status=1
          fi

          if ! [[ "$expected_count" =~ ^[0-9]+$ ]]; then
            echo "::error::skill_count no manifesto precisa ser um número inteiro (valor atual: $expected_count)"
            status=1
          elif [ "$skill_dirs" -ne "$expected_count" ]; then
            echo "::error::skill_count no manifesto é $expected_count, mas existem $skill_dirs pastas em .agents/skills"
            status=1
          fi

          exit "$status"
