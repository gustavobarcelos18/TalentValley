name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore tools
        run: dotnet tool restore

      - name: Restore
        run: dotnet restore backend/TalentValley.slnx

      - name: Build
        run: dotnet build backend/TalentValley.slnx --no-restore --configuration Release

      - name: Test
        run: dotnet test backend/TalentValley.slnx --no-build --configuration Release --logger trx --results-directory TestResults
        env:
          Jwt__SigningKey: ci-only-signing-key-that-is-at-least-32-bytes-long

      - name: Check pending EF model changes
        run: dotnet ef migrations has-pending-model-changes --project backend/TalentValley.Api --configuration Release

  frontend:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
